{% extends 'core/base.html' %}
{% block content %}
<div class="container-fluid mt-3">
    <h2>Stock Transaction</h2>
    <div id="error" class="alert alert-danger d-none"></div>

    <div class="row">
    <div class="col-lg-8">
    <table class="table align-middle">
        <thead>
            <tr><th>Product</th><th>In stock</th><th>Action</th><th style="width: 200px;">Quantity</th><th></th></tr>
        </thead>
        <tbody id="cart"></tbody>
    </table>
    <p id="empty" class="text-muted">Cart is empty. Pick items from the list on the right.</p>

    <input id="note" type="text" class="form-control mb-3" placeholder="Note (optional, applied to all lines)" maxlength="255">
    <button id="save" class="btn btn-dark" disabled>Save Transaction</button>
    <a href="{% url 'home' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>

    <div class="col-lg-4">
        <div class="card" style="position: sticky; top: 10px;">
            <div class="card-header">
                <strong>Items</strong>
                <input id="search" type="text" class="form-control mt-2" autocomplete="off"
                       placeholder="Search name or ID (Enter adds first match)" autofocus>
            </div>
            <div id="results" class="list-group list-group-flush"></div>
            <div class="card-footer d-flex justify-content-between align-items-center">
                <button id="prev" type="button" class="btn btn-sm btn-outline-secondary">‹ Prev</button>
                <small id="pageno" class="text-muted"></small>
                <button id="next" type="button" class="btn btn-sm btn-outline-secondary">Next ›</button>
            </div>
        </div>
    </div>
    </div>
</div>

<script>
(function () {
    const cart = [];                       // {id, name, stock, type, qty}
    const $ = id => document.getElementById(id);
    const search = $('search'), results = $('results'), body = $('cart');
    let timer, hits = [];

    function render() {
        body.innerHTML = '';
        cart.forEach((l, i) => {
            const tr = document.createElement('tr');
            const sel = `<select class="form-select form-select-sm" data-i="${i}" data-f="type">
                <option value="IN"${l.type === 'IN' ? ' selected' : ''}>Add (incoming)</option>
                <option value="OUT"${l.type === 'OUT' ? ' selected' : ''}>Remove (outgoing)</option></select>`;
            tr.innerHTML = `<td></td><td>${l.stock}</td><td>${sel}</td>
                <td><div class="input-group input-group-sm">
                    <button class="btn btn-outline-secondary" data-i="${i}" data-d="-1">−</button>
                    <input type="number" min="1" class="form-control text-center" value="${l.qty}" data-i="${i}" data-f="qty">
                    <button class="btn btn-outline-secondary" data-i="${i}" data-d="1">+</button>
                </div></td>
                <td><button class="btn btn-sm btn-outline-danger" data-i="${i}" data-rm="1">✕</button></td>`;
            tr.firstChild.textContent = l.name;   // textContent: no HTML injection
            if (l.type === 'OUT' && l.qty > l.stock) tr.classList.add('table-warning');
            body.appendChild(tr);
        });
        $('empty').classList.toggle('d-none', cart.length > 0);
        $('save').disabled = cart.length === 0;
    }

    let page = 1, hasNext = false;

    function add(p) {
        const ex = cart.find(l => l.id === p.id);
        if (ex) ex.qty++; else cart.push({id: p.id, name: p.name, stock: p.stock, type: 'IN', qty: 1});
        render(); search.focus();
    }

    async function load() {
        const r = await fetch("{% url 'product-search' %}?q=" + encodeURIComponent(search.value.trim()) + "&page=" + page);
        const d = await r.json();
        hits = d.results; hasNext = d.has_next;
        results.innerHTML = '';
        hits.forEach(p => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
            const n = document.createElement('span'); n.textContent = p.name;
            const s = document.createElement('span'); s.className = 'badge bg-secondary'; s.textContent = 'stock ' + p.stock;
            const plus = document.createElement('span'); plus.className = 'btn btn-sm btn-dark ms-2'; plus.textContent = '+';
            const right = document.createElement('span'); right.append(s, plus);
            b.append(n, right); b.onclick = () => add(p);
            results.appendChild(b);
        });
        if (!hits.length) results.innerHTML = '<div class="list-group-item text-muted">No matches</div>';
        $('prev').disabled = page <= 1; $('next').disabled = !hasNext;
        $('pageno').textContent = 'Page ' + page;
    }

    search.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => { page = 1; load(); }, 200);
    });
    search.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); if (hits.length) add(hits[0]); }
    });
    $('prev').onclick = () => { if (page > 1) { page--; load(); } };
    $('next').onclick = () => { if (hasNext) { page++; load(); } };

    body.addEventListener('click', e => {
        const t = e.target.closest('button'); if (!t) return;
        const i = +t.dataset.i;
        if (t.dataset.rm) cart.splice(i, 1);
        else if (t.dataset.d) cart[i].qty = Math.max(1, cart[i].qty + +t.dataset.d);
        render();
    });
    body.addEventListener('change', e => {
        const i = +e.target.dataset.i, f = e.target.dataset.f;
        if (f === 'qty') cart[i].qty = Math.max(1, parseInt(e.target.value) || 1);
        if (f === 'type') cart[i].type = e.target.value;
        render();
    });

    $('save').addEventListener('click', async () => {
        $('save').disabled = true;
        const r = await fetch(location.href, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
            body: JSON.stringify({note: $('note').value,
                lines: cart.map(l => ({product: l.id, type: l.type, quantity: l.qty}))})
        });
        const d = await r.json();
        if (r.ok) { location.href = d.redirect; return; }
        $('error').textContent = d.error; $('error').classList.remove('d-none');
        $('save').disabled = false;
    });
    render();
    load();
})();
</script>
{% endblock %}
