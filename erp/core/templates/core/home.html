<html>
    <title>Home Page</title>
    <body>
        <h2>{{message}}</h2>
        <h6>{{subtext}}</h6>
        <h1>{{title}}</h1>
        <table border ="1">
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
            </tr>
            {% for product in products %}
                <tr>
                    <td>{{product.name}}</td>
                    <td>{{product.description}}</td>
                    <td>{{product.price}}</td>
                </tr>
            {% endfor %}
        </table>

    </body>
</html>
