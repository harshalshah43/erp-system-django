{% extends 'core/base.html' %}
{% block content %}
<table class = "table table-striped">
    <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th colspan="2">Actions</th>
        
    </tr>
    {% for product in products %}
        <tr>
            <td>{{product.name}}</td>
            <td>{{product.description}}</td>
            <td>{{product.price}}</td>
            <td><a href="{% url 'edit-product' product.id %}"><button class="btn btn-primary">Edit</button></td>
            <td><a href="{% url 'delete-product' product.id %}"><button class="btn btn-danger">Delete</button></td>
        </tr>
    {% endfor %}
</table>
<a href = "{% url 'add-product' %}">
    <button class = "btn btn-dark">
        Add Product
    </button>
</a>
{% endblock %}
