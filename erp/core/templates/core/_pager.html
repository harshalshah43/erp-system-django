{% if page.paginator.num_pages > 1 %}
<nav class="d-flex align-items-center gap-2">
    {% if page.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="{% querystring page=page.previous_page_number %}">‹ Prev</a>
    {% else %}<button class="btn btn-sm btn-outline-secondary" disabled>‹ Prev</button>{% endif %}
    <small class="text-muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</small>
    {% if page.has_next %}<a class="btn btn-sm btn-outline-secondary" href="{% querystring page=page.next_page_number %}">Next ›</a>
    {% else %}<button class="btn btn-sm btn-outline-secondary" disabled>Next ›</button>{% endif %}
</nav>
{% endif %}
